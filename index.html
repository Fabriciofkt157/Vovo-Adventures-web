<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Senhorinha</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #000;
    cursor: crosshair;
  }
  #start-overlay {
    position: fixed;
    inset: 0;
    background: #0c0714;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 10;
  }
  #start-overlay h1 {
    letter-spacing: 2px;
    color: #caa8ff;
  }
  #progress-wrap {
    width: 280px;
    height: 10px;
    border: 2px solid #caa8ff;
    border-radius: 6px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: #caa8ff;
    transition: width 0.1s linear;
  }
  #start-btn {
    padding: 10px 22px;
    font-family: monospace;
    font-size: 15px;
    background: #caa8ff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #start-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <div id="start-overlay">
    <h1>SENHORINHA</h1>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <button id="start-btn" disabled>Carregando...</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
